[package]
name = "localref"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["desktop", "native-tray"]
desktop = ["dep:ui-app"]
native-tray = ["desktop", "dep:tao", "dep:tray-icon"]

[dependencies]
axum = { workspace = true }
clap = { workspace = true }
csc = { path = "crates/csc" }
localref_core = { package = "localref-core", path = "crates/core" }
localref_plugin = { package = "localref-plugin", path = "crates/plugin" }
native-win32 = { path = "crates/native-win32" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
tao = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
ui-app = { path = "crates/ui-app", features = ["ssr"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[workspace]
resolver = "3"
members = [
	"crates/core",
	"crates/csc",
	"crates/native-win32",
	"crates/plugin",
	"crates/plugin-sdk",
	"crates/ui-app",
	"examples/plugins/bibtexer",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
http = "1"
leptos = { version = "0.8", default-features = false }
redb = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tao = "0.30"
tray-icon = "0.21"


[workspace.lints.rust]
missing_debug_implementations = "warn"
unused_results = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
