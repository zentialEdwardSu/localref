[package]
name = "localref"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "localref-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
csc = { path = "crates/csc" }
localref_core = { package = "localref-core", path = "crates/core" }
localref_host = { package = "localref-host", path = "crates/host" }
localref_plugin = { package = "localref-plugin", path = "crates/plugin" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }

[workspace]
resolver = "3"
members = [
	"crates/core",
	"crates/client",
	"crates/csc",
	"crates/ffi",
	"crates/host",
	"crates/plugin",
	"crates/plugin-sdk",
	"examples/plugins/bibtexer",
	"examples/plugins/hooklog",
	"examples/plugins/mdnote",
	"examples/plugins/s3sync",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
cron = "0.15"
http = "1"
redb = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }


[workspace.lints.rust]
missing_debug_implementations = "warn"
unused_results = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
