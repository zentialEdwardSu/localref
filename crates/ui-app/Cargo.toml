[package]
name = "ui-app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr", "leptos_router/ssr", "dep:axum", "dep:localref_core", "dep:localref_plugin", "dep:native-win32", "dep:tokio", "dep:tokio-stream", "dep:mime_guess", "dep:tracing"]
hydrate = [
    "leptos/hydrate",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen-futures",
]

[dependencies]
axum = { workspace = true, optional = true }
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_ui = { workspace = true }
tw_merge = { workspace = true }
icons = { workspace = true }
strum = { workspace = true }
mime_guess = { version = "2", optional = true }
localref_core = { package = "localref-core", path = "../core", optional = true }
localref_plugin = { package = "localref-plugin", path = "../plugin", optional = true }
native-win32 = { path = "../native-win32", optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2.125" }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3" }
web-sys = { version = "0.3", features = ["Blob", "console", "CssStyleDeclaration", "DataTransfer", "Document", "DomParser", "DomRect", "DomTokenList", "DragEvent", "Element", "Event", "EventSource", "EventTarget", "File", "FileList", "FormData", "MessageEvent", "Headers", "History", "HtmlElement", "HtmlFormElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "Location", "MediaQueryList", "MouseEvent", "NodeList", "PointerEvent", "Request", "RequestInit", "RequestMode", "Response", "Storage", "SubmitEvent", "SupportedType", "Url", "UrlSearchParams", "Window"] }

[package.metadata.leptos]
tailwind-input-file = "../../assets/localref-ui.tailwind.css"
ui-dir = "src/ui"
hooks-dir = "src/hooks"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
